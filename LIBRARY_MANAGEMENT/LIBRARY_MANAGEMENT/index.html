<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Central Library Management</title>
    <link rel="stylesheet" href="static/css/style.css">
</head>
<body>

    <div class="app-container">
        <!-- 1. Left Sidebar Navigation -->
        <aside class="sidebar">
            <div class="sidebar-brand">
                <!-- SVG Logo -->
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                    <path d="M19,2H6A3,3,0,0,0,3,5V19a3,3,0,0,0,3,3H19a1,1,0,0,0,1-1V3A1,1,0,0,0,19,2ZM6,4H18V20H6a1,1,0,0,1-1-1V5A1,1,0,0,1,6,4Z"/>
                    <path d="M7,6H16a1,1,0,0,0,0-2H7a1,1,0,0,0,0,2Z"/>
                    <path d="M7,10H16a1,1,0,0,0,0-2H7a1,1,0,0,0,0,2Z"/>
                </svg>
                <h2>CENTRAL LIBRARY</h2>
            </div>
            
            <ul class="sidebar-menu">
                <li>
                    <a href="index.html" class="sidebar-link active">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>
                        <span>Dashboard</span>
                    </a>
                </li>
                <li class="admin-only">
                    <a href="add_book.html" class="sidebar-link">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                        <span>Add Book</span>
                    </a>
                </li>
                <li class="user-only">
                    <a href="issue_book.html" class="sidebar-link">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M12 19V6m-7 7l7-7 7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                        <span>Issue Book</span>
                    </a>
                </li>
                <li class="user-only">
                    <a href="return_book.html" class="sidebar-link">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M12 5v13m-7-7l7 7 7-7" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                        <span>Return Book</span>
                    </a>
                </li>
                <li>
                    <a href="search_book.html" class="sidebar-link">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8" stroke="currentColor" stroke-width="2"/><path d="M21 21l-4.35-4.35" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                        <span>Search Books</span>
                    </a>
                </li>
                <li class="admin-only">
                    <a href="student_records.html" class="sidebar-link">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8z" stroke="currentColor" stroke-width="2"/><path d="M23 21v-2a4 4 0 0 0-3-3.87m-4-12a4 4 0 0 1 0 7.75" stroke="currentColor" stroke-width="2"/></svg>
                        <span>Student Records</span>
                    </a>
                </li>
            </ul>

            <div class="sidebar-footer">
                <div class="user-tag">
                    <div class="user-tag-avatar" id="sidebarAvatar">U</div>
                    <div class="user-tag-info">
                        <div class="user-tag-name" id="sidebarUsername">Username</div>
                        <div class="user-tag-role" id="sidebarRole">Student</div>
                    </div>
                </div>
            </div>
        </aside>

        <!-- 2. Right Work Area -->
        <main class="main-wrapper">
            <!-- Top Navbar -->
            <header class="navbar">
                <div class="navbar-title">Portal Dashboard</div>
                
                <div class="navbar-controls">
                    <!-- Notification Bell Container -->
                    <div class="nav-bell-container" id="bellWrapper">
                        <button class="nav-bell-btn" id="bellBtn">
                            <!-- Bell Icon -->
                            <svg id="bellIcon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                                <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9M13.73 21a2 2 0 0 1-3.46 0" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                            </svg>
                            <span class="nav-bell-badge" id="bellBadge">0</span>
                        </button>
                        
                        <!-- Dropdown Panel -->
                        <div class="notifications-dropdown" id="notificationsDropdown">
                            <div class="notifications-header">
                                <h3>Notifications</h3>
                                <a href="#" class="notifications-mark-read" id="markReadLink">Mark all read</a>
                            </div>
                            <div class="notifications-list" id="notificationsList">
                                <!-- Dynamically Rendered -->
                            </div>
                        </div>
                    </div>

                    <button class="logout-btn" id="logoutBtn">Logout</button>
                </div>
            </header>

            <!-- Main dashboard body -->
            <section class="content-body">
                <!-- Banner Alert Container -->
                <div id="dashboardAlerts"></div>

                <!-- Stats Summary Counters Grid -->
                <div class="stats-grid">
                    <div class="stats-card">
                        <div class="stats-info">
                            <h3>Total Books</h3>
                            <div class="stats-number" id="statTotalBooks">0</div>
                        </div>
                        <div class="stats-icon-wrapper">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20M4 4.5A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5v-15z" stroke="currentColor" stroke-width="2"/></svg>
                        </div>
                    </div>

                    <div class="stats-card">
                        <div class="stats-info">
                            <h3>Issued Books</h3>
                            <div class="stats-number" id="statIssuedBooks">0</div>
                        </div>
                        <div class="stats-icon-wrapper">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M12 20h9M3 20h9M12 4v16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                        </div>
                    </div>

                    <div class="stats-card">
                        <div class="stats-info">
                            <h3>Available Books</h3>
                            <div class="stats-number" id="statAvailableBooks">0</div>
                        </div>
                        <div class="stats-icon-wrapper">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14M22 4L12 14.01l-3-3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                        </div>
                    </div>

                    <div class="stats-card">
                        <div class="stats-info">
                            <h3 id="statFineTitle">Returned (Trx)</h3>
                            <div class="stats-number" id="statFineValue">0</div>
                        </div>
                        <div class="stats-icon-wrapper">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M12 8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3zm0 0v-4m-5 9h10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                        </div>
                    </div>
                </div>

                <!-- Bottom Role-Sensitive Splits -->
                <div class="layout-split" id="dashboardContentLayout">
                    <!-- Dynamic Dashboard Layout based on login roles -->
                </div>
            </section>
        </main>
    </div>

    <!-- Scripts -->
    <script src="static/js/mockData.js"></script>
    <script src="static/js/app.js"></script>
    <script src="static/js/notifications.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", async function() {
            const user = API.getCurrentUser();
            if (!user) return;

            // Load Metrics
            try {
                const stats = await API.getStats();
                document.getElementById("statTotalBooks").textContent = stats.total_books;
                document.getElementById("statIssuedBooks").textContent = stats.issued_books;
                document.getElementById("statAvailableBooks").textContent = stats.available_books;
                
                // Show dynamic card titles and figures depending on role
                const statTitle = document.getElementById("statFineTitle");
                const statVal = document.getElementById("statFineValue");

                if (user.role === 'admin') {
                    statTitle.textContent = "Collected Fines";
                    statVal.textContent = `₹${stats.total_collected_fines}`;
                    renderAdminDashboard(stats);
                } else {
                    statTitle.textContent = "Pending Fines";
                    // Filter fines for this student from stats or records
                    const studentRecords = await API.getBooks();
                    const activeLoans = studentRecords.filter(b => b.issued_to === user.username);
                    
                    let totalPendingFine = 0;
                    const today = new Date();
                    activeLoans.forEach(b => {
                        if (b.due_date) {
                            const due = new Date(b.due_date);
                            if (today > due) {
                                const diffTime = Math.abs(today - due);
                                const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                                totalPendingFine += diffDays * 5;
                            }
                        }
                    });
                    
                    statVal.textContent = `₹${totalPendingFine}`;
                    renderStudentDashboard(activeLoans, totalPendingFine);
                    
                    if (totalPendingFine > 0) {
                        showAlert("dashboardAlerts", `Fine Alert: You currently have ₹${totalPendingFine} pending fine for late return. Please pay at the library.`, "danger");
                    }
                }

            } catch (err) {
                console.error("Dashboard stats load error: ", err);
            }
        });

        // RENDER: Administrator Portal Dashboard
        function renderAdminDashboard(stats) {
            const layout = document.getElementById("dashboardContentLayout");
            
            // Build Overdue Student List Rows
            let overdueRows = '';
            if (stats.overdue_students.length === 0) {
                overdueRows = `<tr><td colspan="5" style="text-align: center; color: var(--text-secondary);">No overdue books currently.</td></tr>`;
            } else {
                stats.overdue_students.forEach(s => {
                    overdueRows += `
                        <tr>
                            <td><strong>${s.username}</strong></td>
                            <td>${s.book_title}</td>
                            <td>${s.due_date}</td>
                            <td><span class="status-pill overdue">${s.overdue_days} Days Late</span></td>
                            <td><strong style="color: var(--danger-text)">₹${s.calculated_fine}</strong></td>
                        </tr>
                    `;
                } );
            }

            layout.innerHTML = `
                <!-- Overdue Tracker -->
                <div class="card" style="margin-bottom: 0;">
                    <div class="card-header">
                        <h2>⚠️ Overdue Students Alerts</h2>
                    </div>
                    <div class="table-responsive">
                        <table class="custom-table">
                            <thead>
                                <tr>
                                    <th>Student</th>
                                    <th>Overdue Book</th>
                                    <th>Due Date</th>
                                    <th>Overdue Time</th>
                                    <th>Pending Fine</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${overdueRows}
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- Recent Activities Feed -->
                <div class="card" style="margin-bottom: 0;">
                    <div class="card-header">
                        <h2>Recent Library Activity</h2>
                    </div>
                    <ul class="activity-feed">
                        <li class="activity-item returned">
                            <div class="activity-marker"></div>
                            <div class="activity-details">
                                <span class="activity-title">'Database Systems' returned by student1</span>
                                <span class="activity-meta">2 hours ago • Paid: ₹10</span>
                            </div>
                        </li>
                        <li class="activity-item overdue">
                            <div class="activity-marker"></div>
                            <div class="activity-details">
                                <span class="activity-title">'Web Development Guide' became overdue</span>
                                <span class="activity-meta">5 days ago • student1</span>
                            </div>
                        </li>
                        <li class="activity-item">
                            <div class="activity-marker"></div>
                            <div class="activity-details">
                                <span class="activity-title">'Python Basics' issued to user</span>
                                <span class="activity-meta">13 days ago • Due tomorrow</span>
                            </div>
                        </li>
                        <li class="activity-item">
                            <div class="activity-marker"></div>
                            <div class="activity-details">
                                <span class="activity-title">New book 'Clean Code' added</span>
                                <span class="activity-meta">15 days ago</span>
                            </div>
                        </li>
                    </ul>
                </div>
            `;
        }

        // RENDER: Borrower Student Portal Dashboard
        function renderStudentDashboard(activeLoans, totalFine) {
            const layout = document.getElementById("dashboardContentLayout");
            
            // Build Borrower Issue items
            let loanRows = '';
            if (activeLoans.length === 0) {
                loanRows = `<tr><td colspan="5" style="text-align: center; color: var(--text-secondary);">You have no active issued books.</td></tr>`;
            } else {
                const today = new Date();
                activeLoans.forEach(b => {
                    const due = new Date(b.due_date);
                    let daysLeftMsg = '';
                    let statusClass = 'available';
                    let statusText = 'Normal';

                    if (today > due) {
                        const diff = Math.ceil(Math.abs(today - due) / (1000 * 60 * 60 * 24));
                        daysLeftMsg = `<span style="color: var(--danger-text); font-weight: bold;">Overdue by ${diff} days</span>`;
                        statusClass = 'overdue';
                        statusText = 'Overdue';
                    } else {
                        const diff = Math.ceil((due - today) / (1000 * 60 * 60 * 24));
                        daysLeftMsg = `<span>${diff} days left</span>`;
                        if (diff <= 2) {
                            statusClass = 'issued';
                            statusText = 'Due Soon';
                        }
                    }

                    loanRows += `
                        <tr>
                            <td><strong>${b.title}</strong></td>
                            <td>${b.author}</td>
                            <td>${b.issue_date || 'N/A'}</td>
                            <td>${b.due_date}</td>
                            <td><span class="status-pill ${statusClass}">${statusText}</span></td>
                        </tr>
                    `;
                });
            }

            layout.innerHTML = `
                <!-- Student loans table -->
                <div class="card" style="margin-bottom: 0;">
                    <div class="card-header">
                        <h2>📚 Your Issued Books & Return Status</h2>
                    </div>
                    <div class="table-responsive">
                        <table class="custom-table">
                            <thead>
                                <tr>
                                    <th>Book Title</th>
                                    <th>Author</th>
                                    <th>Issue Date</th>
                                    <th>Due Date</th>
                                    <th>Status</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${loanRows}
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- Student fine details summary -->
                <div class="card" style="margin-bottom: 0;">
                    <div class="card-header">
                        <h2>💰 Fees & Fines Summary</h2>
                    </div>
                    <div style="text-align: center; padding: 20px 0;">
                        <p style="font-size: 1.1rem; color: var(--text-secondary); margin-bottom: 8px;">TOTAL PENDING FINE</p>
                        <h1 style="font-size: 3.5rem; color: ${totalFine > 0 ? 'var(--danger-text)' : 'var(--success-text)'}; font-weight: 700; margin-bottom: 12px;">₹${totalFine}</h1>
                        <p style="font-size: 0.85rem; color: var(--text-secondary); max-width: 240px; margin: 0 auto 20px auto;">
                            Fine is calculated at ₹5 per day for late return after the due date.
                        </p>
                        ${totalFine > 0 ? `
                            <a href="return_book.html" class="btn btn-primary btn-sm" style="width: 100%;">
                                Return Books to Clear Fines
                            </a>
                        ` : `
                            <div class="status-pill available" style="padding: 8px 16px; font-size: 0.9rem;">
                                No Pending Fines! Great job.
                            </div>
                        `}
                    </div>
                </div>
            `;
        }
    </script>
</body>
</html>
