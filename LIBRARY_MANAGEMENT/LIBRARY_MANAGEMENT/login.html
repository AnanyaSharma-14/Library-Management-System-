<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Central Library Management</title>
    <link rel="stylesheet" href="static/css/style.css">
</head>
<body class="login-body">

    <div class="login-container">
        <!-- Brand Header banner -->
        <div class="login-header">
            <!-- SVG Book Icon -->
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="48" height="48">
                <path d="M19,2H6A3,3,0,0,0,3,5V19a3,3,0,0,0,3,3H19a1,1,0,0,0,1-1V3A1,1,0,0,0,19,2ZM6,4H18V20H6a1,1,0,0,1-1-1V5A1,1,0,0,1,6,4Z"/>
                <path d="M7,6H16a1,1,0,0,0,0-2H7a1,1,0,0,0,0,2Z"/>
                <path d="M7,10H16a1,1,0,0,0,0-2H7a1,1,0,0,0,0,2Z"/>
            </svg>
            <h2>CENTRAL LIBRARY</h2>
            <p>Library Management System Portal</p>
        </div>

        <!-- Credentials Form -->
        <form class="login-form" id="loginForm">
            <div id="alertContainer"></div>

            <div class="form-group">
                <label for="username">USERNAME</label>
                <input type="text" id="username" class="form-control" placeholder="Enter your username" required autocomplete="username">
            </div>

            <div class="form-group">
                <label for="password">PASSWORD</label>
                <input type="password" id="password" class="form-control" placeholder="Enter your password" required autocomplete="current-password">
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px;">
                SIGN IN
            </button>

            <!-- Test Help Tip Box -->
            <div class="login-tips">
                <h4>🔑 Tester Credentials:</h4>
                <p style="margin-bottom: 4px;"><strong>Admin:</strong> <code>admin</code> / <code>admin123</code></p>
                <p><strong>Student:</strong> <code>student1</code> / <code>student123</code> or <code>user</code> / <code>user123</code></p>
            </div>
        </form>
    </div>

    <!-- Scripts -->
    <script src="static/js/mockData.js"></script>
    <script src="static/js/app.js"></script>
    <script>
        document.getElementById("loginForm").addEventListener("submit", async function(e) {
            e.preventDefault();
            const user = document.getElementById("username").value.trim();
            const pass = document.getElementById("password").value.trim();
            const alertCont = document.getElementById("alertContainer");

            try {
                const res = await API.login(user, pass);
                showAlert("alertContainer", "Login successful! Redirecting...", "success");
                setTimeout(() => {
                    window.location.href = "index.html";
                }, 1000);
            } catch (err) {
                showAlert("alertContainer", err.message, "danger");
            }
        });
    </script>
</body>
</html>
