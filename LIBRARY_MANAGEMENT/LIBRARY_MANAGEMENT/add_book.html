<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Book - Central Library Management</title>
    <link rel="stylesheet" href="static/css/style.css">
</head>
<body>

    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-brand">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                    <path d="M19,2H6A3,3,0,0,0,3,5V19a3,3,0,0,0,3,3H19a1,1,0,0,0,1-1V3A1,1,0,0,0,19,2ZM6,4H18V20H6a1,1,0,0,1-1-1V5A1,1,0,0,1,6,4Z"/>
                    <path d="M7,6H16a1,1,0,0,0,0-2H7a1,1,0,0,0,0,2Z"/>
                    <path d="M7,10H16a1,1,0,0,0,0-2H7a1,1,0,0,0,0,2Z"/>
                </svg>
                <h2>CENTRAL LIBRARY</h2>
            </div>
            
            <ul class="sidebar-menu">
                <li>
                    <a href="index.html" class="sidebar-link">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>
                        <span>Dashboard</span>
                    </a>
                </li>
                <li class="admin-only">
                    <a href="add_book.html" class="sidebar-link active">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                        <span>Add Book</span>
                    </a>
                </li>
                <li class="user-only">
                    <a href="issue_book.html" class="sidebar-link">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M12 19V6m-7 7l7-7 7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                        <span>Issue Book</span>
                    </a>
                </li>
                <li class="user-only">
                    <a href="return_book.html" class="sidebar-link">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M12 5v13m-7-7l7 7 7-7" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                        <span>Return Book</span>
                    </a>
                </li>
                <li>
                    <a href="search_book.html" class="sidebar-link">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8" stroke="currentColor" stroke-width="2"/><path d="M21 21l-4.35-4.35" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                        <span>Search Books</span>
                    </a>
                </li>
                <li class="admin-only">
                    <a href="student_records.html" class="sidebar-link">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8z" stroke="currentColor" stroke-width="2"/><path d="M23 21v-2a4 4 0 0 0-3-3.87m-4-12a4 4 0 0 1 0 7.75" stroke="currentColor" stroke-width="2"/></svg>
                        <span>Student Records</span>
                    </a>
                </li>
            </ul>

            <div class="sidebar-footer">
                <div class="user-tag">
                    <div class="user-tag-avatar" id="sidebarAvatar">A</div>
                    <div class="user-tag-info">
                        <div class="user-tag-name" id="sidebarUsername">Admin</div>
                        <div class="user-tag-role" id="sidebarRole">Admin</div>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Main Workspace -->
        <main class="main-wrapper">
            <header class="navbar">
                <div class="navbar-title">Add New Catalog Book</div>
                <button class="logout-btn" id="logoutBtn">Logout</button>
            </header>

            <section class="content-body">
                <div id="addBookAlerts"></div>

                <div class="layout-split reverse">
                    <!-- Form Card -->
                    <div class="card">
                        <div class="card-header">
                            <h2>📖 Book Details Form</h2>
                        </div>
                        <form id="addBookForm">
                            <div class="form-group">
                                <label for="bookTitle">BOOK TITLE</label>
                                <input type="text" id="bookTitle" class="form-control" placeholder="Enter book title" required>
                            </div>
                            <div class="form-group">
                                <label for="bookAuthor">AUTHOR NAME</label>
                                <input type="text" id="bookAuthor" class="form-control" placeholder="Enter author name" required>
                            </div>
                            <button type="submit" class="btn btn-primary" style="width: 100%;">
                                ADD TO LIBRARY
                            </button>
                        </form>
                    </div>

                    <!-- Inventory Preview Card -->
                    <div class="card">
                        <div class="card-header">
                            <h2>📚 Library Inventory Registry</h2>
                        </div>
                        <div class="table-responsive">
                            <table class="custom-table" id="booksInventoryTable">
                                <thead>
                                    <tr>
                                        <th>ID</th>
                                        <th>Book Title</th>
                                        <th>Author</th>
                                        <th>Borrow Status</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <!-- Dynamic rows -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- Scripts -->
    <script src="static/js/mockData.js"></script>
    <script src="static/js/app.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            // Guard role access
            const user = API.getCurrentUser();
            if (user && user.role !== 'admin') {
                window.location.href = 'index.html';
                return;
            }
            loadInventory();
        });

        async function loadInventory() {
            const tbody = document.querySelector("#booksInventoryTable tbody");
            if (!tbody) return;

            try {
                const books = await API.getBooks();
                if (books.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="4" style="text-align: center; color: var(--text-secondary);">No books registered in the catalog yet.</td></tr>`;
                    return;
                }

                let html = '';
                books.forEach(b => {
                    const statusClass = b.status.toLowerCase() === 'available' ? 'available' : 'issued';
                    html += `
                        <tr>
                            <td><strong>#${b.book_id}</strong></td>
                            <td>${b.title}</td>
                            <td>${b.author}</td>
                            <td><span class="status-pill ${statusClass}">${b.status}</span></td>
                        </tr>
                    `;
                });
                tbody.innerHTML = html;
            } catch(e) {
                console.error("Error loading inventory catalog: ", e);
            }
        }

        document.getElementById("addBookForm").addEventListener("submit", async function(e) {
            e.preventDefault();
            const titleInput = document.getElementById("bookTitle");
            const authorInput = document.getElementById("bookAuthor");

            const title = titleInput.value.trim();
            const author = authorInput.value.trim();

            try {
                await API.addBook(title, author);
                showAlert("addBookAlerts", `Success: '${title}' has been successfully added to the library catalogue.`, "success");
                titleInput.value = '';
                authorInput.value = '';
                loadInventory();
            } catch(err) {
                showAlert("addBookAlerts", err.message, "danger");
            }
        });
    </script>
</body>
</html>
