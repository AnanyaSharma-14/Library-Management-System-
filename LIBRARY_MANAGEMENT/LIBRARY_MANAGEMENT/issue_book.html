<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Issue Book - Central Library Management</title>
    <link rel="stylesheet" href="static/css/style.css">
</head>
<body>

    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">

                    <path d="M7,6H16a1,1,0,0,0,0-2H7a1,1,0,0,0,0,2Z"/>
                    <path d="M7,10H16a1,1,0,0,0,0-2H7a1,1,0,0,0,0,2Z"/>
                </svg>
                <h2>CENTRAL LIBRARY</h2>
            </div>
            
            <ul class="sidebar-menu">
                <li>
                    <a href="index.html" class="sidebar-link">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>
                        <span>Dashboard</span>
                    </a>
                </li>
                <li class="admin-only">
                    <a href="add_book.html" class="sidebar-link">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                        <span>Add Book</span>
                    </a>
                </li>
                <li class="user-only">
                    <a href="issue_book.html" class="sidebar-link active">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M12 19V6m-7 7l7-7 7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                        <span>Issue Book</span>
                    </a>
                </li>
                <li class="user-only">
                    <a href="return_book.html" class="sidebar-link">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M12 5v13m-7-7l7 7 7-7" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                        <span>Return Book</span>
                    </a>
                </li>
                <li>
                    <a href="search_book.html" class="sidebar-link">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8" stroke="currentColor" stroke-width="2"/><path d="M21 21l-4.35-4.35" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                        <span>Search Books</span>
                    </a>
                </li>
                <li class="admin-only">
                    <a href="student_records.html" class="sidebar-link">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8z" stroke="currentColor" stroke-width="2"/><path d="M23 21v-2a4 4 0 0 0-3-3.87m-4-12a4 4 0 0 1 0 7.75" stroke="currentColor" stroke-width="2"/></svg>
                        <span>Student Records</span>
                    </a>
                </li>
            </ul>

            <div class="sidebar-footer">
                <div class="user-tag">
                    <div class="user-tag-avatar" id="sidebarAvatar">U</div>
                    <div class="user-tag-info">
                        <div class="user-tag-name" id="sidebarUsername">Username</div>
                        <div class="user-tag-role" id="sidebarRole">Student</div>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Workspace -->
        <main class="main-wrapper">
            <header class="navbar">
                <div class="navbar-title">Borrow Book Directory</div>
                
                <div class="navbar-controls">
                    <!-- Bell -->
                    <div class="nav-bell-container" id="bellWrapper">
                        <button class="nav-bell-btn" id="bellBtn">
                            <svg id="bellIcon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                                <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9M13.73 21a2 2 0 0 1-3.46 0" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                            </svg>
                            <span class="nav-bell-badge" id="bellBadge">0</span>
                        </button>
                        <div class="notifications-dropdown" id="notificationsDropdown">
                            <div class="notifications-header">
                                <h3>Notifications</h3>
                                <a href="#" class="notifications-mark-read" id="markReadLink">Mark all read</a>
                            </div>
                            <div class="notifications-list" id="notificationsList"></div>
                        </div>
                    </div>
                    <button class="logout-btn" id="logoutBtn">Logout</button>
                </div>
            </header>

            <section class="content-body">
                <div id="issueBookAlerts"></div>

                <div class="card">
                    <div class="card-header">
                        <h2>📚 Available Books to Issue</h2>
                    </div>
                    <div class="table-responsive">
                        <table class="custom-table" id="availableBooksTable">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Book Title</th>
                                    <th>Author Name</th>
                                    <th>Status</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody>
                                <!-- Dynamic rows -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- Scripts -->
    <script src="static/js/mockData.js"></script>
    <script src="static/js/app.js"></script>
    <script src="static/js/notifications.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            // Guard role access
            const user = API.getCurrentUser();
            if (user && user.role === 'admin') {
                window.location.href = 'index.html';
                return;
            }
            loadAvailableBooks();
        });

        async function loadAvailableBooks() {
            const tbody = document.querySelector("#availableBooksTable tbody");
            if (!tbody) return;

            try {
                const books = await API.getBooks();
                // Filter only available ones
                const avail = books.filter(b => b.status.toLowerCase() === 'available');

                if (avail.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="5" style="text-align: center; color: var(--text-secondary);">No books are currently available to borrow. Check back later!</td></tr>`;
                    return;
                }

                let html = '';
                avail.forEach(b => {
                    html += `
                        <tr>
                            <td><strong>#${b.book_id}</strong></td>
                            <td>${b.title}</td>
                            <td>${b.author}</td>
                            <td><span class="status-pill available">Available</span></td>
                            <td>
                                <button onclick="issueBookHandler('${b.book_id}', '${escape(b.title)}')" class="btn btn-primary btn-sm">
                                    Borrow Book
                                </button>
                            </td>
                        </tr>
                    `;
                });
                tbody.innerHTML = html;
            } catch (e) {
                console.error("Error loading available books: ", e);
            }
        }

        async function issueBookHandler(bookId, escapedTitle) {
            const title = unescape(escapedTitle);
            if (!confirm(`Are you sure you want to borrow '${title}'?`)) return;

            try {
                await API.issueBook(bookId);
                showAlert("issueBookAlerts", `Success: '${title}' has been successfully issued to you for 14 days.`, "success");
                loadAvailableBooks();
                
                // Re-render bell dropdown counts
                if (window.NotificationSystem) {
                    window.NotificationSystem.renderNotificationsUI();
                }
            } catch (err) {
                showAlert("issueBookAlerts", err.message, "danger");
            }
        }
    </script>
</body>
</html>
